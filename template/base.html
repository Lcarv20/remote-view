<!DOCTYPE html>
<html lang="en" class="{{HTML_CLASS}}" data-default-theme="{{THEME_MODE}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <title>{{TITLE}} · remote-view</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%231f5d8c'/%3E%3C/svg%3E">

  <!-- Prevent theme FOUC before first paint -->
  <script>
    (() => {
      const root = document.documentElement;
      const params = new URLSearchParams(window.location.search);
      const paramTheme = params.get("theme");
      const savedTheme = (() => {
        try { return localStorage.getItem("rv-theme"); } catch { return null; }
      })();
      const def = root.dataset.defaultTheme || "dark";
      const resolved = (paramTheme === "light" || paramTheme === "dark")
        ? paramTheme
        : (savedTheme === "light" || savedTheme === "dark")
          ? savedTheme
          : (def === "auto"
              ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
              : def);

      root.classList.remove("rv-dark", "rv-light");
      root.classList.add(resolved === "light" ? "rv-light" : "rv-dark");
      root.dataset.theme = resolved;
      root.style.colorScheme = resolved;
    })();
  </script>

  {{RV_CSS_TAG}}

  <!-- Highlight.js (dark + light theme stylesheets toggled dynamically) -->
  <link id="rv-hljs-dark" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.12.0/styles/tokyo-night-dark.min.css">
  <link id="rv-hljs-light" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.12.0/styles/github.min.css" disabled>
  <script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.12.0/highlight.min.js"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.6.1/dist/chart.umd.min.js"></script>
  <script>
    window.rvSyncHighlightTheme = (theme) => {
      const darkLink = document.getElementById("rv-hljs-dark");
      const lightLink = document.getElementById("rv-hljs-light");
      if (darkLink) darkLink.disabled = theme === "light";
      if (lightLink) lightLink.disabled = theme !== "light";
    };

    window.rvApplyChartTheme = (theme) => {
      if (!window.Chart) return;
      const isDark = theme !== "light";
      const textColor = isDark ? "#ece7dc" : "#1f1e1a";
      const mutedColor = isDark ? "#aaa396" : "#5c584e";
      const gridColor = isDark ? "rgba(170, 163, 150, 0.14)" : "rgba(31, 30, 26, 0.10)";

      Chart.defaults.animation = false;
      Chart.defaults.color = textColor;
      Chart.defaults.borderColor = gridColor;
      if (Chart.defaults.plugins?.legend?.labels) {
        Chart.defaults.plugins.legend.labels.color = textColor;
      }
      if (Chart.defaults.scale?.ticks) {
        Chart.defaults.scale.ticks.color = mutedColor;
      }
      if (Chart.defaults.scale?.grid) {
        Chart.defaults.scale.grid.color = gridColor;
      }

      const instances = Chart.instances ? Object.values(Chart.instances) : [];
      for (const chart of instances) {
        if (chart?.options?.scales) {
          for (const axis of Object.values(chart.options.scales)) {
            if (axis.ticks) axis.ticks.color = mutedColor;
            if (axis.grid) axis.grid.color = gridColor;
          }
        }
        chart.update("none");
      }
    };

    (() => {
      const theme = document.documentElement.dataset.theme || "dark";
      window.rvSyncHighlightTheme(theme);
      window.rvApplyChartTheme(theme);
    })();
  </script>

  <!-- KaTeX (renders $$, \[, \( without touching single $ in code/prose) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.19.1/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.19.1/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.19.1/dist/contrib/auto-render.min.js"></script>
</head>
<body>
  <header class="rv-topbar">
    <div class="rv-topbar-inner">
      <div class="rv-brand">
        <button type="button" id="rv-menu-btn" class="rv-icon-btn rv-menu-trigger" aria-label="Open navigation">
          <i data-icon="menu-2"></i>
        </button>
        <span class="rv-dot" aria-hidden="true"></span>
        <span class="rv-doc-title">{{TITLE}}</span>
        <span class="rv-doc-meta">{{DROP_ID}} · {{GENERATED_AT}}</span>
      </div>
      <div class="rv-actions">
        <button type="button" class="rv-icon-btn" id="rv-copy-url" aria-label="Copy page URL">
          <i data-icon="copy"></i>
          <span id="rv-copy-url-label">Copy URL</span>
        </button>
        <button type="button" class="rv-icon-btn" id="rv-theme-toggle" aria-label="Toggle color theme">
          <i id="rv-theme-icon" data-icon="sun"></i>
          <span id="rv-theme-label">Light</span>
        </button>
      </div>
    </div>
  </header>

  <div class="rv-shell">
    <main id="rv-main" class="rv-main">
{{CONTENT}}
    </main>
  </div>

  {{RV_JS_TAG}}
</body>
</html>
